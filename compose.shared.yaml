name: bid-analysis-shared
services:
  analyzer:
    build:
      context: .
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-af.hikvision.com.cn/docker/library/python:3.12-slim}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-http://af.hikvision.com.cn/artifactory/api/pypi/pypi/simple}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-af.hikvision.com.cn}
    restart: unless-stopped
    env_file: .env.shared
    environment:
      SOURCE_MODE: shared
      ANALYSIS_SCHEMA: ${ANALYSIS_SCHEMA:-bid_analysis}
      DATABASE_URL: ${DATABASE_URL:?Set main database URL in .env.shared}
      ANALYZER_API_KEY: ${ANALYZER_API_KEY:?Set ANALYZER_API_KEY in .env.shared}
    ports:
      - "${ANALYZER_BIND_HOST:-127.0.0.1}:${ANALYZER_PORT:-8100}:8100"
    volumes:
      - ${ANALYSIS_RUNTIME_DIR:?Set persistent runtime directory}:/app/runtime
      - ${BID_DATA_DIR:?Set main data directory}:/data/bidinfo:ro
    read_only: true
    tmpfs:
      - /tmp:size=64m
    init: true
    stop_grace_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    security_opt:
      - no-new-privileges:true
